name: Bug report
description: Report a problem with swarmloop
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets or credentials in an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior you saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the steps and relevant configuration with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: swarmloop version or commit
    validations:
      required: true
