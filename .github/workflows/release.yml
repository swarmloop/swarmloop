name: release

# `git tag v0.2.0 && git push origin v0.2.0` releases: the images are built and pushed as :0.2.0, the stack is started
# from them, then they also become :latest and a GitHub release is created with compose.yml and env.example.
# A tag with a suffix (v0.2.0-rc1) is a prerelease: it never moves :latest.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      repo: ${{ steps.tag.outputs.repo }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is vMAJOR.MINOR.PATCH[-suffix] on a commit of main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "$TAG is not a release tag: expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG does not point at a commit on main"
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: swarmloop-server, file: docker/server/Dockerfile, context: . }
          - { name: swarmloop-dashboard, file: docker/dashboard/Dockerfile, context: . }
          - { name: swarmloop-agent-claude, file: docker/sandbox/Dockerfile.claude, context: docker/sandbox }
          - { name: swarmloop-agent-codex, file: docker/sandbox/Dockerfile.codex, context: docker/sandbox }
          - { name: swarmloop-agent-cursor, file: docker/sandbox/Dockerfile.cursor, context: docker/sandbox }
          - { name: swarmloop-egress, file: docker/egress/Dockerfile, context: docker/egress }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.repo }}/${{ matrix.name }}:${{ needs.version.outputs.version }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

  smoke:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Start the stack from the pushed images
        env:
          SWARMLOOP_REGISTRY: ${{ needs.version.outputs.repo }}
          SWARMLOOP_VERSION: ${{ needs.version.outputs.version }}
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -eu
          docker compose --env-file .env.example pull
          bash scripts/smoke-stack.sh

  publish:
    needs: [version, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Point :latest at this release
        if: needs.version.outputs.prerelease != 'true'
        env:
          REPO: ${{ needs.version.outputs.repo }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          for name in swarmloop-server swarmloop-dashboard swarmloop-agent-claude swarmloop-agent-codex swarmloop-agent-cursor swarmloop-egress; do
            docker buildx imagetools create -t "$REPO/$name:latest" "$REPO/$name:$VERSION"
          done
      # GitHub renames an asset whose name starts with a dot, so .env.example ships as env.example.
      - name: Create the GitHub release with compose.yml and env.example
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -eu
          cp .env.example env.example
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" compose.yml env.example --clobber
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" compose.yml env.example --verify-tag --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" compose.yml env.example --verify-tag --title "$TAG" --generate-notes
          fi
