name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server

  dashboard-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: bash scripts/ci-tools.sh dashboard-test
      - run: npm run typecheck
        working-directory: dashboard

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: dashboard
      - run: bash scripts/ci-tools.sh dashboard-test
      - run: bash scripts/ci-tools.sh lint
      - run: npx eslint --fix .
      - run: bash scripts/lint-changed.sh origin/${{ github.event.repository.default_branch }} --fix
      - run: npx eslint .
      - run: bash scripts/lint-changed.sh origin/${{ github.event.repository.default_branch }}
      - run: node --test scripts/ci-tools.test.mjs scripts/changed-files.test.mjs scripts/autofix.test.mjs

  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: dashboard
      - run: bash scripts/ci-tools.sh dashboard-test
      - run: bash scripts/ci-tools.sh lint
      - run: bash scripts/autofix.sh origin/${{ github.event.repository.default_branch }}

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server

  dashboard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: bash scripts/ci-tools.sh dashboard-test
      - run: npm test
        working-directory: dashboard

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/server/Dockerfile -t swarmloop-server .
      - run: docker build -f docker/dashboard/Dockerfile -t swarmloop-dashboard .

  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-structure.test.mjs
      - run: node scripts/check-structure.mjs
