name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server

  dashboard-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: bash scripts/ci-tools.sh dashboard-test
      - run: npm run typecheck
        working-directory: dashboard

  cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes madge@8 --circular --extensions ts,tsx --ts-config server/tsconfig.json server/src dashboard

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: dashboard
      - run: bash scripts/ci-tools.sh dashboard-test
      - run: bash scripts/ci-tools.sh lint
      - run: npx eslint --fix .
      - run: bash scripts/lint-changed.sh origin/${{ github.event.repository.default_branch }} --fix
      - run: npx eslint .
      - run: bash scripts/lint-changed.sh origin/${{ github.event.repository.default_branch }}
      - run: npx eslint --config eslint.strict.config.mjs .
      - run: node --test scripts/ci-tools.test.mjs scripts/lint-run-state.test.mjs scripts/check-worktree.test.mjs scripts/changed-files.test.mjs scripts/autofix.test.mjs docker/egress/proxy.test.mjs

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: dashboard
      - run: npx --yes knip@5 --include files,exports,types

  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: dashboard
      - run: bash scripts/ci-tools.sh dashboard-test
      - run: bash scripts/ci-tools.sh lint
      - run: bash scripts/autofix.sh origin/${{ github.event.repository.default_branch }}

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server

  dashboard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: bash scripts/ci-tools.sh dashboard-test
      - run: npm test
        working-directory: dashboard

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images from the PR
        run: |
          set -eu
          args="--build-arg REVISION=${{ github.sha }} --build-arg VERSION=ci --build-arg SOURCE_URL=${{ github.server_url }}/${{ github.repository }}"
          docker build $args -f docker/server/Dockerfile -t local/swarmloop-server:ci .
          docker build $args -f docker/dashboard/Dockerfile -t local/swarmloop-dashboard:ci .
          for runtime in cursor claude codex; do
            docker build $args -f docker/sandbox/Dockerfile.$runtime -t local/swarmloop-agent-$runtime:ci docker/sandbox
          done
          docker build $args -t local/swarmloop-egress:ci docker/egress
      - name: Start deploy/compose.yml in an empty directory
        run: |
          set -eu
          work="$(mktemp -d)"
          mkdir -p "$work/home" "$work/checkouts/fixture"
          git -C "$work/checkouts/fixture" init -q
          git -C "$work/checkouts/fixture" -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m fixture
          mkdir "$work/stack"
          cp deploy/compose.yml "$work/stack/compose.yml"
          cp deploy/.env.example "$work/stack/.env"
          cd "$work/stack"
          export SWARMLOOP_REGISTRY=local SWARMLOOP_VERSION=ci SWARMLOOP_HOME="$work/home" CHECKOUTS_ROOT="$work/checkouts"
          trap 'docker compose logs; docker compose down -v' EXIT
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:3920/health
          curl -fsS http://127.0.0.1:3921/ > /dev/null
          curl -fsS http://127.0.0.1:3921/swarmloop-api/health
          SWARMLOOP_SOCKET_URL=http://live.example:4000 docker compose up -d --wait
          curl -fsS http://127.0.0.1:3921/ | grep -F 'http://live.example:4000'

  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-structure.test.mjs
      - run: node scripts/check-structure.mjs
