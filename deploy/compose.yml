name: swarmloop

services:
  # The server launches sandboxes by the fixed names swarmloop-agent-<runtime> and swarmloop-egress.
  # This one-shot service pulls a registry image when it is missing and tags it with that name.
  sandbox-images:
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-server:${SWARMLOOP_VERSION:?set SWARMLOOP_VERSION}
    restart: 'no'
    environment:
      REGISTRY: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}
      VERSION: ${SWARMLOOP_VERSION}
    command:
      - sh
      - -c
      - |
        set -eu
        for name in swarmloop-agent-cursor swarmloop-agent-claude swarmloop-agent-codex swarmloop-egress; do
          ref="$$REGISTRY/$$name:$$VERSION"
          docker image inspect "$$ref" > /dev/null 2>&1 || docker pull "$$ref"
          docker tag "$$ref" "$$name"
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  server:
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-server:${SWARMLOOP_VERSION}
    ports:
      - '127.0.0.1:3920:3920'
    env_file:
      - path: .env
        required: false
    environment:
      SWARMLOOP_ROOT: /app
      CHECKOUTS_ROOT: /checkouts
      SWARMLOOP_API_HOST: 0.0.0.0
      SWARMLOOP_API_PORT: 3920
      SWARMLOOP_UID: ${UID:-1000}
    volumes:
      - ${SWARMLOOP_HOME:?set SWARMLOOP_HOME}/data:/app/data
      - ${SWARMLOOP_HOME}/worktrees:/app/worktrees
      - ${CHECKOUTS_ROOT:?set CHECKOUTS_ROOT}:/checkouts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-images:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3920/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  dashboard:
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-dashboard:${SWARMLOOP_VERSION}
    ports:
      - '127.0.0.1:3921:3921'
    environment:
      SWARMLOOP_API_URL: http://server:3920
      SWARMLOOP_SOCKET_URL: ${SWARMLOOP_SOCKET_URL:-http://127.0.0.1:3920}
    volumes:
      - ${SWARMLOOP_HOME}/data:/app/dashboard/public/run-logs:ro
    depends_on:
      server:
        condition: service_healthy
