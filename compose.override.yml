# Builds every image from this checkout instead of pulling the release.
# Compose reads this file next to compose.yml by itself; a release folder has no such file and pulls.

services:
  agent-cursor:
    image: swarmloop-agent-cursor
    build:
      context: ./docker/sandbox
      dockerfile: Dockerfile.cursor

  agent-claude:
    image: swarmloop-agent-claude
    build:
      context: ./docker/sandbox
      dockerfile: Dockerfile.claude

  agent-codex:
    image: swarmloop-agent-codex
    build:
      context: ./docker/sandbox
      dockerfile: Dockerfile.codex

  egress:
    image: swarmloop-egress
    build:
      context: ./docker/egress

  server:
    image: swarmloop-server
    pull_policy: build
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    environment:
      # No registry: the server runs the local images built above.
      SWARMLOOP_REGISTRY: ''

  dashboard:
    image: swarmloop-dashboard
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
