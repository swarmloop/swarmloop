name: swarmloop

# Install: no .env is needed.
# A release folder holds this file alone: `docker compose up -d` pulls the published images.
# A clone of the repository builds from source: Compose reads compose.override.yml next to this file by itself.
# To change a setting, copy its line from defaults.env into .env next to this file, or set it in the shell. The shell wins.
# Compose control variables keep their Compose meaning:
#   SWARMLOOP_HOME is where data/ and worktrees/ live (default: next to this file).
#   SWARMLOOP_VERSION pins a release (default: latest) and SWARMLOOP_REGISTRY names the registry of the images.
#   UID is the sandbox user. COMPOSE_FILE, if set, selects the files Compose reads.
# An old `COMPOSE_FILE=compose.yml:compose.build.yml` line in .env names a file that is gone: delete it.

x-image: &image
  restart: 'no'
  command: ['true']

services:
  # The server starts sandboxes from these images. They are services only so that compose pulls them.
  agent-cursor:
    <<: *image
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-agent-cursor:${SWARMLOOP_VERSION:-latest}

  agent-claude:
    <<: *image
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-agent-claude:${SWARMLOOP_VERSION:-latest}

  agent-codex:
    <<: *image
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-agent-codex:${SWARMLOOP_VERSION:-latest}

  egress:
    <<: *image
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-egress:${SWARMLOOP_VERSION:-latest}
    entrypoint: ['node']
    command: ['--version']

  server:
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-server:${SWARMLOOP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3920:3920'
    environment:
      - SWARMLOOP_ROOT=/app
      - CHECKOUTS_ROOT=/checkouts
      - SWARMLOOP_API_HOST=0.0.0.0
      - SWARMLOOP_API_PORT=3920
      - SWARMLOOP_UID=${UID:-1000}
      - SWARMLOOP_PUBLIC_URL=${SWARMLOOP_PUBLIC_URL:-http://127.0.0.1:3921}
      # The server names the sandbox images the same way, so it runs the ones compose pulled.
      - SWARMLOOP_REGISTRY=${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}
      - SWARMLOOP_VERSION=${SWARMLOOP_VERSION:-latest}
      - SWARMLOOP_ENV_FILE=/app/stack/.env
      # Every other setting passes through only when it is set; otherwise defaults.env applies.
      - REQUIREMENTS_VIA
      - ISSUE_TRACKER
      - JIRA_PROJECTS
      - GITLAB_BASE_URL
      - GITHUB_BASE_URL
      - GITHUB_TOKEN
      - GITLAB_TOKEN
      - CURSOR_API_KEY
      - ANTHROPIC_API_KEY
      - CLAUDE_CODE_OAUTH_TOKEN
      - CODEX_AUTH
      - CODEX_API_KEY
      - JIRA_BASE_URL
      - JIRA_EMAIL
      - JIRA_API_TOKEN
      - MAX_AGENT_CALLS
      - MAX_RETURNS
      - MAX_PIPELINE_RETURNS
      - MAX_LAUNCHES
      - CHECKS_PARALLEL
      - RESERVE_MEMORY_GB
      - LIMIT_COOLDOWN_MIN
      - STOP_GRACE_S
      - RECONCILE_MS
      - MERGE_WATCH_MIN
      - RECOVER_WAIT_MS
      - RETAIN_DONE_DAYS
      - MIN_FREE_GB
      - DOCKER_PRUNE
      - MAX_RUN_USD
      - MAX_RUN_TOKENS
      - STEP_USD_MAX
      - STEP_TOKEN_MAX
      - IDLE_TIMEOUT_MS
      - LOOP_REPEAT
      - SANDBOX_EGRESS
      - SANDBOX_DOCKER_RUNTIME
      - PROJECT_HOSTS_ALLOW
      - TICK_MS
      - REQUIREMENTS_TIMEOUT_MS
      - RESEARCH_TIMEOUT_MS
      - PLAN_TIMEOUT_MS
      - IMPLEMENT_TIMEOUT_MS
      - CODE_REVIEW_TIMEOUT_MS
      - MERGE_REQUEST_TIMEOUT_MS
      - PIPELINE_TIMEOUT_MS
      - PIPELINE_START_TIMEOUT_MS
      - AGENTS_PLAN
      - AGENTS_IMPLEMENT
      - AGENTS_REVIEW
      - AGENTS_SUBTASK_PLAN
      - AGENTS_SUBTASK_IMPLEMENT
      - AGENTS_SUBTASK_REVIEW
      - EPIC_EFFORT
      - SPLIT
      - SPLIT_MAX_TASKS
      - SUBTASKS_PARALLEL
      - SWARMLOOP_REPOS
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GITHUB_OAUTH_CLIENT_ID
      - GITHUB_OAUTH_CLIENT_SECRET
      - GITLAB_OAUTH_CLIENT_ID
      - GITLAB_OAUTH_CLIENT_SECRET
      - SWARMLOOP_ALLOW
      - SWARMLOOP_TOKEN
      - SWARMLOOP_SECRET
    volumes:
      - ${SWARMLOOP_HOME:-.}/data:/app/data
      - ${SWARMLOOP_HOME:-.}/worktrees:/app/worktrees
      - .:/app/stack:ro
      - ${CHECKOUTS_ROOT:-..}:/checkouts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      agent-cursor:
        condition: service_completed_successfully
      agent-claude:
        condition: service_completed_successfully
      agent-codex:
        condition: service_completed_successfully
      egress:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3920/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  dashboard:
    image: ${SWARMLOOP_REGISTRY:-ghcr.io/swarmloop}/swarmloop-dashboard:${SWARMLOOP_VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3921/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    ports:
      - '127.0.0.1:3921:3921'
    environment:
      SWARMLOOP_API_URL: http://server:3920
      SWARMLOOP_PUBLIC_URL: ${SWARMLOOP_PUBLIC_URL:-http://127.0.0.1:3921}
      SWARMLOOP_SOCKET_URL: ${SWARMLOOP_SOCKET_URL:-http://127.0.0.1:3920}
    depends_on:
      server:
        condition: service_healthy
